<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEODayUnlocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
<style>
  :root{
    --design-w:1080px;
    --design-h:1920px;
    --design-ratio:1080 / 1920;
    --cream:#FBF3E7;
    --panel:#FFFDF9;
    --brown:#5A3E2B;
    --brown-soft:#8A6A52;
    --caramel:#E8A33D;
    --strawberry:#F0728C;
    --strawberry-dark:#D9536E;
    --mint:#6FBF8B;
    --fail:#E0645B;
    --line:#EEDFC9;
    /* 9-slice(나인패치) 버튼 공용 설정
       --nineslice-source-size : btn_option.png / btn_select.png 원본 이미지의 한 변 길이(px). 정사각형 기준.
       --nineslice-corner      : 원본 이미지에서 "찌그러지면 안 되는" 모서리 두께(px, 원본 이미지 기준 좌표).
                                  실제 PNG 받으면 이 두 값만 그 파일에 맞게 고치면 전체 버튼에 다 반영됨.
       --nineslice-screen-corner: 화면에 실제로 보여질 모서리 두께(px). 버튼이 작아져도 이 값은 고정 유지됨. */
    --nineslice-source-size:96;
    --nineslice-corner:24;
    --nineslice-screen-corner:15px;
  }
  *{box-sizing:border-box;}
  html{ height:100%; overflow:hidden; }
  body{
    margin:0;
    font-family:'Poor Story', cursive;
    background: radial-gradient(circle at 15% 10%, #FFF7EC 0%, var(--cream) 45%, #F6E8D2 100%);
    color:var(--brown);
    height:100%;
    width:100%;
    overflow:hidden;
    position:relative;
  }
  body.fonts-loading .stage{
    visibility:hidden;
  }
  body.fonts-ready .stage{
    visibility:visible;
  }
  h1,h2,h3, .display{ font-family:'Poor Story', cursive; font-weight:400; }
  .stage{
    /* 고정 픽셀 디자인 캔버스. 안의 모든 요소(폰트, 패딩, 아이콘 px 등)가
       이 고정 크기 기준으로 그려지고, JS가 화면 크기에 맞춰 이 박스 전체를
       하나의 덩어리로 scale()시켜서 배치함 (내부 비율은 항상 100% 고정 유지). */
    position:fixed;
    top:50%; left:50%;
    width:var(--design-w);
    height:var(--design-h);
    transform: translate(-50%,-50%) scale(var(--game-scale, 1));
    transform-origin:center center;
    background:var(--cream);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:absolute; top:0; left:0; width:100%; z-index:50;
    padding:100px 0 20px; display:flex; justify-content:center;
    pointer-events:none;
  }
  .progressbar-track{ width:850px; height:38px; background:#F1E4CC; border-radius:19px; overflow:hidden; }
  .progressbar-fill{
    height:100%; width:0%;
    background-color:var(--strawberry); /* progress.png 로드 실패 시 대체 채움색 */
    background-image:url('Assets/ui/progress.png');
    background-size:100% 100%;
    background-repeat:no-repeat;
    transition:width .3s ease;
  }
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    padding:16px 22px 18px;
    animation:none !important;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .screen.active{ display:flex; }
  /* 반죽 만들기 화면 전용 배경 (부엌 배경 에셋) */
  #screen-dough, #screen-meringue, #screen-mold, #screen-topping, #screen-deco{
    background:url('Assets/bg/bg_kitchen.png') left top / 1080px 1920px no-repeat;
  }
  #screen-home{
    background:url('Assets/bg/bg_home.png') left top / 1080px 1920px no-repeat;
  }
  #screen-result{
    background:url('Assets/bg/bg_result.png') left top / 1080px 1920px no-repeat;
    animation:none !important;
  }
  #screen-gameover{
    background:url('Assets/bg/bg_fail.png') left top / 1080px 1920px no-repeat;
    position:relative;
    overflow:hidden;
  }
  #screen-oven{
    background:url('Assets/bg/bg_oven.png') left top / 1080px 1920px no-repeat;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .screen.screen-transition-in{
    animation:fadeIn .35s ease both !important;
  }
  .title{ font-size:21px; margin:2px 0 4px; color:var(--brown); }
  .subtitle{ font-size:13px; color:var(--brown-soft); margin:0 0 10px; line-height:1.5; }
  .center-flex{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px; }
  .big-emoji{ font-size:155px; line-height:1; }
  button{ font-family:'Poor Story', cursive; cursor:pointer; border:none; }
  .btn-primary{
    background:var(--strawberry); /* btn_primary.png 로드 실패 시 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_primary.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    color:#fff; font-family:'Jua', sans-serif; font-size:50px;
    padding:34px 49px; transition:transform .08s; z-index:100; }
  .btn-primary:active{ transform:translateY(4px); }
  .btn-primary:disabled{ opacity:0.55; cursor:not-allowed; }
  .card-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:4px 0; height:32%; flex-shrink:0; align-content:center; }
  .card-grid.cols-4{ grid-template-columns:1fr 1fr 1fr 1fr; }
  /* 재료 옵션 버튼: btn_option(기본) / btn_select(선택됨) 에셋 사용 */
  /* 재료 옵션 버튼: 9-slice(나인패치) 적용
     border-image-slice 값은 원본 PNG 좌표 기준 px이라 --nineslice-corner를 그대로 씀.
     border-image-width는 화면에 실제로 보이는 두께라서 --nineslice-screen-corner를 씀.
     'fill' 키워드로 가운데 조각도 배경처럼 함께 채워짐(9번째 조각). */
  .item-card{
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_option.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    padding:8px 3px 6px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--brown-soft);
    transition:all .15s;
  }
  .item-card .item-icon{ width:60%; height:auto; display:block; object-fit:contain; }
  .item-card.selected{
    border-image-source:url('Assets/ui/btn_select.png');
    color:var(--strawberry-dark);
    transform:translateY(-2px);
  }
  /* 재료가 담기는 보울 비주얼 (bowl_base 에셋을 배경으로 사용) */
  .bowl-visual{
    position:relative; width:100%; height:43%; flex-shrink:0; margin:2px 0 10px;
  }
  /* bowl_base.png 없을 때를 대비한 CSS 대체 그릇 모양 (실제 이미지는 .bowl-base-img가 그 위를 덮음) */
  .bowl-base-img{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    z-index:1; pointer-events:none;
  }
  .bowl-items{ position:absolute; inset:0; z-index:2; pointer-events:none; }

  /* ===== 반죽 만들기 화면 전용 (스펙 좌표: 기준 1080x1920, 좌상단 원점) ===== */
  .dough-header-text{
    position:absolute; left:130px; top:165px; width:820px;
    font-size:44px; line-height:1.3; color:var(--brown);
    font-family:'Jua', sans-serif; text-align:left;
  }
  .meringue-notice-text{
    position:absolute; left:130px; top:235px; width:820px;
    font-size:29px; line-height:1.3; color:var(--brown-soft);
    font-family:'Poor Story', cursive; text-align:left;
  }
  .dough-cooking-area{
    position:absolute; left:-45px; top:343px; width:1170px; height:729px;
  }
  .dough-ingredient-grid{
    position:absolute; left:145px; top:992px; width:790px; height:593px;
    display:grid; grid-template-columns:repeat(4, 185px); grid-auto-rows:191px;
    gap:10px 9px; justify-content:center; z-index:100; }
  .dough-item-card{
    position:relative; width:185px; height:191px;
    background:#FCEAE4; /* 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_option.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    cursor:pointer; transition:transform .12s;
  }
  .dough-item-card.selected{
    background-color:#FFF0F3;
    border-image-source:url('Assets/ui/btn_select.png');
    transform:translateY(-2px);
  }
  .dough-item-card .icon-container{
    position:absolute; left:50%; top:22px; transform:translateX(-50%);
    width:80px; height:80px; display:flex; align-items:center; justify-content:center;
    font-size:56px;
  }
  .dough-item-card .icon-container img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .dough-item-card .name-text{
    position:absolute; left:0; right:0; top:120px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-size:29px; color:var(--brown); font-family:'Poor Story', cursive; text-align:center;
  }
  .dough-item-card .check-badge{
    position:absolute; top:8px; right:10px; width:28px; height:28px; border-radius:50%;
    background:var(--strawberry); color:#fff; font-size:16px; font-weight:bold;
    display:none; align-items:center; justify-content:center;
  }
  .dough-item-card.selected .check-badge{ display:flex; }
  .dough-complete-btn{
    position:absolute; left:245px; top:1661px; width:590px; height:119px;
    background:var(--strawberry); /* btn_primary.png 로드 실패 시 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_primary.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    color:#fff; font-family:'Jua', sans-serif; font-size:40px;
    cursor:pointer; transition:transform .08s, opacity .2s; z-index:100; }
  .dough-complete-btn:active{ transform:translateY(4px); }
  .dough-complete-btn:disabled{ opacity:0.55; cursor:not-allowed; }

  /* ===== 틀 선택 화면 전용 (기준 1080x1920) ===== */
  .mold-preview-area{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .mold-preview-empty{
    width:400px; height:400px; border:3px dashed var(--line); border-radius:24px;
    display:flex; align-items:center; justify-content:center; color:var(--brown-soft);
    font-size:34px; text-align:center; line-height:1.6; font-family:'Poor Story', cursive;
    pointer-events:auto; margin-top:-300px;
  }
  .mold-frame-img{ position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .mold-frame-img.pouring{ animation:pourShake .35s ease; }
  .mold-frame-img.shaped-pop{ animation:fadeScaleIn .3s ease; }
  @keyframes fadeScaleIn{ from{ opacity:0; transform:scale(0.94); } to{ opacity:1; transform:scale(1); } }

  .mold-option-grid{
    position:absolute; left:145px; top:1092px; width:790px; height:191px;
    display:grid; grid-template-columns:repeat(3, 185px); grid-auto-rows:191px;
    gap:0 20px; justify-content:center; z-index:100; }
  .mold-option-card{
    position:relative; width:185px; height:191px;
    background:#FCEAE4; /* 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_option.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    cursor:pointer; transition:transform .12s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .mold-option-card.selected{
    background-color:#FFF0F3;
    border-image-source:url('Assets/ui/btn_select.png');
    transform:translateY(-2px);
  }
  .mold-option-card .emoji{ font-size:56px; }
  .mold-option-card .name-text{ font-size:29px; color:var(--brown); font-family:'Poor Story', cursive; }

  .mold-confirm-btn{
    position:absolute; left:245px; top:1661px; width:590px; height:119px;
    background:var(--strawberry); /* btn_primary.png 로드 실패 시 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_primary.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    color:#fff; font-family:'Jua', sans-serif; font-size:40px;
    cursor:pointer; transition:transform .08s, opacity .2s; z-index:100; }
  .mold-confirm-btn:active{ transform:translateY(4px); }
  .mold-confirm-btn:disabled{ opacity:0.55; cursor:not-allowed; }

  /* ===== 토핑 올리기 화면 전용 (dough 재료 그리드와 동일 좌표) ===== */
  .topping-option-grid{
    position:absolute; left:145px; top:1072px; width:790px; height:593px;
    display:grid; grid-template-columns:repeat(4, 185px); grid-auto-rows:191px;
    gap:10px 9px; justify-content:center; z-index:100; }
  .topping-option-card{
    position:relative; width:185px; height:191px;
    background:#FCEAE4; /* 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_option.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    cursor:pointer; transition:transform .12s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .topping-option-card.selected{
    background-color:#FFF0F3;
    border-image-source:url('Assets/ui/btn_select.png');
    transform:translateY(-2px);
  }
  .topping-option-card .emoji{ font-size:56px; }
  .topping-option-card .name-text{ font-size:29px; color:var(--brown); font-family:'Poor Story', cursive; }
  .topping-confirm-btn{
    position:absolute; left:245px; top:1661px; width:590px; height:119px;
    background:var(--strawberry);
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_primary.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    color:#fff; font-family:'Jua', sans-serif; font-size:40px;
    cursor:pointer; transition:transform .08s; z-index:100; }
  .topping-confirm-btn:active{ transform:translateY(4px); }

  /* ===== 생일 장식하기 화면 전용 (가로로 긴 옵션, 한 줄에 하나씩) ===== */
  .deco-option-list{
    position:absolute; left:215px; top:1022px; width:650px; height:500px;
    display:flex; flex-direction:column; gap:18px; z-index:100; }
  .deco-option-card{
    position:relative; width:650px; height:123px;
    background:#fff; /* 대체 배경 */
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_option.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    cursor:pointer; transition:transform .12s;
    display:flex; align-items:center; justify-content:center; gap:16px;
    font-size:36px; color:var(--brown-soft); font-family:'Poor Story', cursive;
  }
  .deco-option-card.selected{
    background-color:#FFF6E6; color:var(--brown);
    border-image-source:url('Assets/ui/btn_select.png');
  }
  .deco-option-card .emoji{ font-size:36px; }
  .deco-confirm-btn{
    position:absolute; left:245px; top:1661px; width:590px; height:119px;
    background:var(--strawberry);
    border-style:solid;
    border-width:var(--nineslice-screen-corner);
    border-image-source:url('Assets/ui/btn_primary.png');
    border-image-slice:var(--nineslice-corner) fill;
    border-image-width:var(--nineslice-screen-corner);
    border-image-repeat:stretch;
    background-clip:padding-box;
    border-radius:0;
    color:#fff; font-family:'Jua', sans-serif; font-size:40px;
    cursor:pointer; transition:transform .08s; z-index:100; }
  .deco-confirm-btn:active{ transform:translateY(4px); }

  .bowl-item-full{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    pointer-events:none;
    animation:fadeInLayer .3s ease;
  }
  @keyframes fadeInLayer{ from{ opacity:0; } to{ opacity:1; } }
  .bowl-empty-hint{ position:absolute; left:50%; top:64%; transform:translate(-50%,-50%); font-size:12px; color:#B99B6E; z-index:2; white-space:nowrap; }
  /* 반죽 완성 후(bowl_dough) / 머랭 완성 후(bowl_mixed) 오버레이 이미지 공용 스타일 */
  .bowl-overlay-img{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    z-index:3; opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
  }
  .bowl-overlay-img.show{ opacity:1; }
  .footer-row{ margin-top:auto; display:flex; flex-direction:column; gap:6px; align-items:center; padding-top:8px; }
  .meringue-gauge-wrap{ position:absolute; left:145px; top:992px; width:790px; }
  .progress-track{ width:100%; height:32px; background:#F1E4CC; border-radius:16px; overflow:hidden; border:3px solid var(--line); }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--caramel), var(--strawberry)); width:0%; transition:width .06s linear; }
  .timer-track{ width:100%; height:14px; background:#F1E4CC; border-radius:7px; overflow:hidden; margin-top:12px; }
  .timer-fill{ height:100%; background:var(--brown-soft); width:100%; }
  /* 원형 드래그 젓기 (bowl-visual 위에 whisk.png를 겹쳐서 사용) */
  .stir-zone{
    position:absolute; left:45px; right:45px; top:0; bottom:0;
    transform:translateY(-95px);
    z-index:4; touch-action:none; user-select:none; -webkit-user-select:none; display:none;
  }
  .stir-whisk{
    position:absolute; width:234px; height:234px; margin-left:-117px; margin-top:-117px;
    object-fit:contain; pointer-events:none;
    filter:drop-shadow(0 3px 2px rgba(90,62,43,0.35));
  }
  .stir-hint{ position:absolute; left:50%; top:85%; transform:translate(-50%,-50%); font-size:22px; color:var(--strawberry-dark); text-align:center; line-height:1.4; pointer-events:none; opacity:0.9; background:rgba(255,255,255,0.8); padding:8px 16px; border-radius:14px; font-family:'Poor Story', cursive; }
  /* ===== 오븐에 굽기 화면 전용 =====
     오븐 모양 자체는 bg_oven.png 배경에 포함됨. oven_{mold}_off.png(굽기 전) / oven_{mold}_on.png(굽는 중)를 풀캔버스로 얹음.
     온도 버튼/정지 버튼은 dough 화면과 완전히 동일한 클래스(.dough-item-card, .dough-complete-btn) 재사용. */
  .oven-shaped-img{ position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; z-index:1; }
  /* ===== 결과 화면 전용 ===== */
  .final-cake-group{
    position:absolute; left:0; top:0; width:1080px; height:1920px;
    transform:translateY(620px); z-index:3;
  }

<script>
/* ---------- 에셋 경로 ----------
   실제 폴더 구조(Assets/bg, Assets/ui, Assets/event)에 맞춤.

function parseCSVLine(line){
  const result = [];
  let value = '';
  let quoted = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(quoted && line[i+1] === '"'){ value += '"'; i++; }
      else { quoted = !quoted; }
    } else if(ch === ',' && !quoted){
      result.push(value);
      value = '';
    } else {
      value += ch;
    }
  }
  result.push(value);
  return result;
}

function parseCSV(csv){
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;

  for(let i=0;i<csv.length;i++){
    const ch = csv[i];
    if(ch === '"'){
      if(quoted && csv[i+1] === '"'){ field += '"'; i++; }
      else { quoted = !quoted; }
    } else if(ch === ',' && !quoted){
      row.push(field);
      field = '';
    } else if((ch === '\n' || ch === '\r') && !quoted){
      if(ch === '\r' && csv[i+1] === '\n') i++;
      row.push(field);
      if(row.some(v=>v !== '')) rows.push(row);
      row = [];
      field = '';
    } else {
      field += ch;
    }
  }
  if(field !== '' || row.length){
    row.push(field);
    if(row.some(v=>v !== '')) rows.push(row);
  }
  return rows;
}

async function loadStrings(){
  try{
    const response = await fetch(STRING_CSV_PATH, {cache:'no-store'});
    if(!response.ok) throw new Error(`CSV HTTP ${response.status}`);

    const csv = await response.text();
    const rows = parseCSV(csv);
    if(!rows.length) throw new Error('CSV is empty');

    const headers = rows[0].map(h=>String(h).trim().replace(/^\uFEFF/,''));
    const keyIndex = headers.indexOf('Key');
    const krIndex = headers.indexOf('string_kr');
    const enIndex = headers.indexOf('string_en');

    if(keyIndex === -1 || krIndex === -1 || enIndex === -1){
      throw new Error('CSV headers must include Key, string_kr, string_en');
    }

    const table = {};
    rows.slice(1).forEach(row=>{
      const key = String(row[keyIndex] || '').trim();
      if(!key) return;
      table[key] = {
        kr: String(row[krIndex] || ''),
        en: String(row[enIndex] || '')
      };
    });

    stringTable = table;
    stringsReady = true;
    applyStrings();
    console.info('[i18n] CSV loaded:', STRING_CSV_PATH);
  }catch(err){
    stringsReady = false;
    stringTable = {};
    console.warn('[i18n] CSV를 불러오지 못했습니다. 한국어 fallback을 사용합니다.', err);
    applyStrings();
  }
}

function t(key){
  const fallback = FALLBACK_KR[key] ?? key;
  const entry = stringTable[key];

  // CSV가 없거나 해당 키가 없으면 한국어 fallback.
  if(!entry) return fallback;

  if(currentLanguage === 'en'){
    // 영어 문자열이 비어 있으면 한국어 → 내장 fallback 순서로 대체.
    return entry.en || entry.kr || fallback;
  }

  // 한국어 문자열이 비어 있으면 내장 fallback.
  return entry.kr || fallback;
}

function stringToHtml(value){
  return String(value || '').replace(/\n/g, '<br>');
}

function applyStrings(){
  document.querySelectorAll('[data-string-key]').forEach(el=>{
    el.innerHTML = stringToHtml(t(el.dataset.stringKey));

}

/* ---------- 사운드 (에셋 없이 Web Audio API로 합성) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, startOffset, duration, type, peakVolume){
  const ctx = getAudioCtx();
  if(!ctx) return;
  type = type || 'sine';
  peakVolume = peakVolume === undefined ? 0.16 : peakVolume;
  const t0 = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakVolume, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playSequence(notes){
  notes.forEach(n=>{ playTone(n.freq, n.delay, n.duration, n.type, n.volume); });
}
function playNoiseBurst(startOffset, duration, peakVolume, filterFreq){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + startOffset;
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq || 900;
  filter.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakVolume===undefined?0.12:peakVolume, t0 + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(t0);
}
/* ---------- 머랭 휘젓기 루프(stir-A) 전용: 시작/정지 가능한 지속음 ---------- */
let stirLoopNodes = null;
function startStirLoop(){
  const ctx = getAudioCtx();
  if(!ctx || stirLoopNodes) return;
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 700;
  filter.Q.value = 0.6;
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 4.2;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 260;
  lfo.connect(lfoGain).connect(filter.frequency);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 0.15);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start();
  lfo.start();
  stirLoopNodes = { src, lfo, gain };
}
function stopStirLoop(){
  if(!stirLoopNodes) return;
  const ctx = getAudioCtx();
  const { src, lfo, gain } = stirLoopNodes;
  if(ctx){
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
  }
  setTimeout(()=>{ try{ src.stop(); lfo.stop(); }catch(e){} }, 150);
  stirLoopNodes = null;
}

function clearBGMFade(){
  if(bgmFadeTimer){
    clearInterval(bgmFadeTimer);
    bgmFadeTimer = null;
  }
}

function fadeInAudio(audio, duration=1800){
  if(!audio) return;
  clearBGMFade();
  audio.volume = 0;
  const steps = 36;
  const stepMs = duration / steps;
  let step = 0;
  bgmFadeTimer = setInterval(()=>{
    step++;
    audio.volume = Math.min(0.9, (step / steps) * 0.9);
    if(step >= steps){
      clearBGMFade();
      audio.volume = 0.9;
    }
  }, stepMs);
}

function startMainBGM(fadeIn=true, restartFromBeginning=false){
  initBGM();
  if(!bgmEnabled) return;

  if(bgmResult){
    bgmResult.pause();
    bgmResult.currentTime = 0;
  }

  currentBGM = 'main';
  if(!bgmMain) return;

  if(restartFromBeginning){
    bgmMain.currentTime = 0;
  }

  bgmMain.loop = true;
  bgmMain.volume = fadeIn ? 0 : 0.9;

  const p = bgmMain.play();
  if(p && typeof p.catch === 'function') p.catch(()=>{});

  if(fadeIn) fadeInAudio(bgmMain, 1800);
}

const sfx = {
  /* click-B: 팝 */
  click(){ playTone(760, 0, 0.055, 'square', 0.11); },
  /* select-C: 말랑 (부드럽게 살짝 피치가 내려가는 톤) */
  select(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t0);
    osc.frequency.exponentialRampToValueAtTime(400, t0 + 0.11);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.14, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.16);
  },
  /* stir-A: 휘휘 (루프) */
  stirStart(){ startStirLoop(); },
  stirStop(){ stopStirLoop(); },
  /* timer-C: 통 */
  ovenTick(){ playTone(340, 0, 0.05, 'triangle', 0.09); },
  /* success-B: 반짝챠임 (중간 단계 성공) */
  stepSuccess(){ playSequence([

    {freq:1568.0, delay:0.12, duration:0.22, type:'sine', volume:0.15},
  ]); },
  /* oven-B: 띵동 (오븐 완료 알림) */
  ovenComplete(){ playSequence([

    {freq:1046.5, delay:0.20, duration:0.34, type:'sine', volume:0.16}, // C6
  ]); },
  /* sad-C: 안타까움 (실패/게임오버) */
  fail(){ playSequence([
    {freq:392.00, delay:0,    duration:0.20, type:'sine', volume:0.13}, // G4
    {freq:349.23, delay:0.18, duration:0.20, type:'sine', volume:0.12}, // F4

    {freq:261.63, delay:0.54, duration:0.40, type:'sine', volume:0.11}, // C4
  ]); },

  complete(){
    playSequence([
      {freq:523.25, delay:0,    duration:0.14, type:'triangle', volume:0.15}, // C5
      {freq:659.25, delay:0.11, duration:0.14, type:'triangle', volume:0.15}, // E5
      {freq:783.99, delay:0.22, duration:0.14, type:'triangle', volume:0.15}, // G5
      {freq:1046.5, delay:0.33, duration:0.14, type:'triangle', volume:0.16}, // C6
      {freq:1318.5, delay:0.44, duration:0.50, type:'triangle', volume:0.16}, // E6
    ]);
    // 마지막 화음(팡파레 느낌)
    playTone(1046.5, 0.44, 0.55, 'sine', 0.09);

/* ---------- 고정 캔버스 스케일링 ----------
   .stage는 항상 --design-w x --design-h(고정 px)로 그려지고,
   실제 화면 크기에 맞춰 이 값(--game-scale)만 바꿔서 통째로 확대/축소함.

let currentGameScale = 1;

  const designH = 1920;  // --design-h 와 동일한 값으로 유지

function showScreen(id, transitionIn=false){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
    s.classList.remove('screen-transition-in');
  });

  const target = document.getElementById('screen-'+id);
  if(transitionIn) target.classList.add('screen-transition-in');
  target.classList.add('active');

  if(transitionIn){
    // 애니메이션이 다음 진입에도 정상적으로 재생되도록 1회성 클래스로 사용.

  updateProgressBar(id);

function goTo(id){
  const currentScreen = document.querySelector('.screen.active');
  const currentId = currentScreen ? currentScreen.id.replace('screen-','') : '';

  // 배경이 실제로 바뀌는 화면 전환만 Fade.
  // 같은 bg_main(bg_kitchen)을 공유하는 화면끼리는 즉시 전환한다.
  const fadePairs = new Set([
    'mold->oven',
    'oven->mold',
    'oven->topping',
    'result->home',
    'gameover->home'
  ]);
  const needsTransition = fadePairs.has(`${currentId}->${id}`);

  const finishNavigation = ()=>{
    const cookingArea = document.getElementById('shared-cooking-area');
    if(cookingArea){
      cookingArea.style.display = (id==='dough' || id==='meringue') ? 'block' : 'none';
    }

    const stirZone = document.getElementById('stir-zone');
    if(stirZone){
      stirZone.style.display = (id==='meringue') ? 'block' : 'none';
    }

    const cakeLayer = document.getElementById('shared-cake-layer');
    if(cakeLayer){
      cakeLayer.style.display = (id==='topping' || id==='deco') ? 'block' : 'none';
    }

    // 대상 화면의 내용/그래픽을 먼저 준비한 뒤 화면을 표시한다.
    if(id==='dough') renderDough();
    if(id==='meringue') startMeringue();
    if(id==='mold') renderMold();
    if(id==='oven') renderOvenStart();
    if(id==='topping') renderTopping();
    if(id==='deco') renderDeco();

    if(id === 'home'){
      initBGM();
      restoreMainBGMVolume();
      showHomeStartButton();
    }

    showScreen(id);
  };

  if(needsTransition){
    // 검은 화면을 끼우지 않고, 새 화면 자체가 자연스럽게 Fade In.
    // 기존에 사용하던 0.35초 fadeIn(약간의 위쪽 이동) 연출을 그대로 사용한다.
    const originalShowScreen = window.showScreen;
    window.showScreen = function(targetId){
      originalShowScreen(targetId, true);
      window.showScreen = originalShowScreen;
    };

    finishNavigation();
  }else{
    finishNavigation();
  }
}

/* ---------- 2. 머랭 (원형 드래그 젓기, 즉시 실패 가능) ---------- */
let meringueProgress = 0;
let meringueTime = 6.0;
const MERINGUE_DURATION = 6.0;
const MERINGUE_THRESHOLD = 90;
const STIR_SCALE = 3.0;
const STIR_DECAY = 0.9;
const STIR_RADIUS = 186;
let meringueInterval = null;
let meringueDone = false;
let stirActive = false;
let stirLastAngle = null;
function startMeringue(){
  meringueProgress = 0;
  meringueTime = MERINGUE_DURATION;
  meringueDone = false;
  stirActive = false;
  stirLastAngle = null;
  setBowlVariantImages();
  const doughOverlay = document.getElementById('dough-bowl-batter');
  const meringueOverlay = document.getElementById('meringue-bowl-overlay');
  if(doughOverlay){
    doughOverlay.classList.add('show');
    doughOverlay.style.opacity = '1';
  }
  if(meringueOverlay){
    meringueOverlay.classList.remove('show');
    meringueOverlay.style.opacity = '0';
  }
  updateSpoonPosition(-Math.PI/2);
  updateMeringueUI();
  if(meringueInterval) clearInterval(meringueInterval);
  meringueInterval = setInterval(meringueTick, 100);
}
function meringueTick(){
  if(meringueDone) return;
  meringueTime -= 0.1;
  meringueProgress = Math.max(0, meringueProgress - STIR_DECAY);
  updateMeringueUI();
  if(meringueTime <= 0){
    meringueDone = true;
    clearInterval(meringueInterval);
    if(meringueProgress >= MERINGUE_THRESHOLD){ meringueSuccess(); } else { gameOver('meringue'); }
  }
}
function stirAngleFromEvent(e){
  const rect = document.getElementById('stir-zone').getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  return Math.atan2(e.clientY - cy, e.clientX - cx);
}
function updateSpoonPosition(angle){
  const spoon = document.getElementById('stir-whisk');
  const zone = document.getElementById('stir-zone');
  const cx = zone.clientWidth / 2;
  const cy = zone.clientHeight / 2;
  spoon.style.left = (cx + STIR_RADIUS * Math.cos(angle)) + 'px';
  spoon.style.top = (cy + STIR_RADIUS * Math.sin(angle)) + 'px';
}
function onStirDown(e){
  if(meringueDone) return;
  stirActive = true;
  stirLastAngle = stirAngleFromEvent(e);
  sfx.stirStart();
  const zone = document.getElementById('stir-zone');
  if(zone.setPointerCapture && e.pointerId !== undefined){
    try{ zone.setPointerCapture(e.pointerId); }catch(err){}
  }
}
function onStirMove(e){
  if(!stirActive || meringueDone) return;
  const angle = stirAngleFromEvent(e);
  let delta = angle - stirLastAngle;
  while(delta > Math.PI) delta -= Math.PI*2;
  while(delta < -Math.PI) delta += Math.PI*2;
  meringueProgress = Math.min(100, meringueProgress + Math.abs(delta) * STIR_SCALE);
  stirLastAngle = angle;
  updateSpoonPosition(angle);
  updateMeringueUI();
  if(meringueProgress >= MERINGUE_THRESHOLD){
    meringueDone = true;
    clearInterval(meringueInterval);
    meringueSuccess();
  }
}
function onStirUp(){ stirActive = false; stirLastAngle = null; sfx.stirStop(); }
function updateMeringueUI(){
  document.getElementById('meringue-fill').style.width = meringueProgress + '%';
  document.getElementById('meringue-timer').style.width = (meringueTime / MERINGUE_DURATION * 100) + '%';

  /* 휘젓는 동안 bowl_dough -> bowl_mixed를 진행도에 맞춰 서서히 크로스페이드 */
  const meringueOverlay = document.getElementById('meringue-bowl-overlay');
  if(meringueOverlay){
    const blend = Math.min(1, meringueProgress / MERINGUE_THRESHOLD);
    meringueOverlay.style.opacity = blend.toFixed(3);
  }
}
function meringueSuccess(){
  sfx.stirStop();
  sfx.stepSuccess();
  const meringueOverlay = document.getElementById('meringue-bowl-overlay');
  if(meringueOverlay){
    meringueOverlay.classList.add('show');
    meringueOverlay.style.opacity = '1';
  }
  setTimeout(()=>goTo('mold'), 600);
}
(function setupStirZoneEvents(){
  const zone = document.getElementById('stir-zone');
  zone.addEventListener('pointerdown', onStirDown);
  zone.addEventListener('pointermove', onStirMove);
  zone.addEventListener('pointerup', onStirUp);
  zone.addEventListener('pointercancel', onStirUp);
})();

      <span class="temp-value-text">${t}°C</span>
    </button>
  `).join('');
}
function chooseTemp(t){
  sfx.click();
  if(t !== CORRECT_TEMP){ gameOver('oven_temp'); return; }
  setTimeout(()=>{
    document.getElementById('oven-step-temp').style.display = 'none';
    document.getElementById('oven-step-timing').style.display = 'block';
    document.getElementById('oven-stop-btn').style.display = 'block';
    const suffix = moldSuffix(state.mold);
    const onImg = document.getElementById('oven-on-img');
    onImg.style.display = '';
    onImg.classList.remove('show');
    onImg.src = `${ASSET_EVENT}oven_${suffix}_on.png`;
    void onImg.offsetWidth; // 강제 리플로우로 트랜지션이 확실히 걸리도록
    requestAnimationFrame(()=>{ onImg.classList.add('show'); });
    const zone = document.getElementById('oven-zone');
    zone.style.left = OVEN_ZONE_START + '%';
    zone.style.width = (OVEN_ZONE_END - OVEN_ZONE_START) + '%';
    startOvenAnim();
  }, 400);
}
function startOvenAnim(){
  ovenPos = 0; ovenDir = 1; ovenStopped = false;
  const pointer = document.getElementById('oven-pointer');
  function frame(){
    if(ovenStopped) return;
    ovenPos += ovenDir * 1.5;
    if(ovenPos >= 100){ ovenPos = 100; ovenDir = -1; }
    if(ovenPos <= 0){ ovenPos = 0; ovenDir = 1; }
    pointer.style.left = ovenPos + '%';
    ovenAnim = requestAnimationFrame(frame);
  }
  ovenAnim = requestAnimationFrame(frame);
  if(ovenTickInterval) clearInterval(ovenTickInterval);
  ovenTickInterval = setInterval(()=>{ if(!ovenStopped) sfx.ovenTick(); }, 320);
}
function stopOven(){
  if(ovenStopped) return;
  sfx.click();
  ovenStopped = true;
  cancelAnimationFrame(ovenAnim);
  document.getElementById('oven-stop-btn').style.display = 'none';
  if(ovenTickInterval){ clearInterval(ovenTickInterval); ovenTickInterval = null; }
  if(ovenPos >= OVEN_ZONE_START && ovenPos <= OVEN_ZONE_END){ sfx.ovenComplete(); goTo('topping'); }
  else { gameOver('oven_timing'); }
}
/* ---------- 토핑 링 렌더링 (단일 선택, 가장자리를 따라 여러 개) ---------- */
function renderToppingRing(targetId, toppingId){
  const layer = document.getElementById(targetId);
  if(!toppingId){ layer.innerHTML = ''; return; }
  layer.innerHTML = `<img class="topping-combo-img" src="${ASSET_EVENT}topping_${toppingId}.png" alt="" onerror="this.style.display='none'">`;
}
/* ---------- 5. 토핑 (단일 선택) ---------- */
function renderTopping(){
  const grid = document.getElementById('topping-grid');
  grid.innerHTML = TOPPING_ITEMS.map(item=>`
    <button type="button" class="topping-option-card ${state.topping===item.id?'selected':''}" onclick="selectTopping('${item.id}')">
      <span class="emoji">${item.emoji}</span>
      <span class="name-text">${t(item.nameKey)}</span>
    </button>
  `).join('');
  const cakeBase = document.getElementById('shared-cake-base');
  cakeBase.style.display = '';
  cakeBase.src = `${ASSET_EVENT}baked_${moldSuffix(state.mold)}.png`;
  const candleImg = document.getElementById('shared-candle-img');
  candleImg.style.display = 'none';
  candleImg.src = '';
  renderToppingRing('shared-cake-toppings', state.topping);
}
function selectTopping(id){ sfx.select(); state.topping = id; renderTopping(); }
function confirmTopping(){
  sfx.click();
  if(!state.topping){ alert(t('alert.topping.empty')); return; }
  state.toppingOK = state.topping !== 'strawberry';
  goTo('deco');
}
/* ---------- 6. 장식 (메시지만, 케이크에 쪽지로 표시) ---------- */
function renderDeco(){
  const msgRow = document.getElementById('message-row');
  msgRow.innerHTML = MESSAGE_OPTIONS.map(m=>`
    <button type="button" class="deco-option-card ${state.message===m.id?'selected':''}" onclick="selectMessage('${m.id}')">
      <span class="emoji">✏️</span><span>${t(m.key)}</span>
    </button>
  `).join('');
  document.getElementById('shared-cake-note-text').textContent = t(MESSAGE_OPTIONS.find(m=>m.id===state.message).key);
  document.getElementById('shared-cake-note-wrap').classList.add('show');
}
function selectMessage(id){
  sfx.select();
  state.message = id;
  const noteWrap = document.getElementById('shared-cake-note-wrap');
  noteWrap.classList.remove('show');
  void noteWrap.offsetWidth;
  renderDeco();
}
/* ---------- 7. 음료 (성공/실패 영향 없음) ---------- */
/* ---------- 결과 연출 (완성 케이크 -> 캐릭터가 먹는 연출 -> 평가) ---------- */
function showResult(){
  startResultBGM();
  showScreen('result');

  const sharedCakeLayer = document.getElementById('shared-cake-layer');
  if(sharedCakeLayer) sharedCakeLayer.style.display = 'none';

  const overallSuccess = state.doughOK && state.toppingOK;

  // 결과 화면의 기존 이모티콘 연출은 완전히 제거.
  const oldChar = document.getElementById('char-emoji');
  if(oldChar) oldChar.style.display = 'none';

  // 초기화
  const cakeGroup = document.querySelector('#screen-result .final-cake-group');
  cakeGroup.classList.remove('show');

  const lookFace = document.getElementById('result-face-look');
  const outcomeFace = document.getElementById('result-face-outcome');

  lookFace.classList.remove('show');
  lookFace.style.display = 'none';

  outcomeFace.classList.remove('show');
  outcomeFace.style.display = 'none';
  outcomeFace.src = overallSuccess
    ? `${ASSET_EVENT}result_face_success.png`
    : `${ASSET_EVENT}result_face_fail.png`;

  const badge = document.getElementById('result-badge');
  const speech = document.getElementById('result-speech');
  const retryBtn = document.getElementById('result-retry-btn');

  badge.className = 'badge fade-target hidden result-badge-pos';
  badge.textContent = '';
  speech.className = 'speech fade-target hidden result-speech-pos';
  speech.innerHTML = '';
  retryBtn.classList.remove('show');

  // 케이크 그룹 구성
  const mold = moldSuffix(state.mold);
  const finalCakeImg = document.getElementById('final-cake-shape');
  finalCakeImg.style.display = '';
  finalCakeImg.src = `${ASSET_EVENT}baked_${mold}.png`;

  renderToppingRing('final-toppings-layer', state.topping);

  const msg = MESSAGE_OPTIONS.find(m=>m.id===state.message);
  document.getElementById('final-cake-note-text').textContent = msg ? t(msg.key) : '';
  document.getElementById('final-cake-note-wrap').classList.remove('show');
  document.getElementById('final-cake-note-wrap').classList.add('show');

  const candleImg = document.getElementById('final-candle-img');
  candleImg.style.display = '';
  candleImg.src = `${ASSET_EVENT}deco_candle.png`;

  // 1 → bg_result는 showScreen('result')에서 이미 표시.
  // 2 → 이모티콘 연출 제거.
  // 3 → 케이크 그룹과 result_face_look은 정확히 동시에 시작.
  // 케이크 그룹은 2초, look 얼굴은 1초 동안 Fade In.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      cakeGroup.classList.add('show');
      lookFace.style.display = '';
      lookFace.classList.add('show');
    });
  });

  // 케이크가 등장한 뒤 성공/실패 얼굴을 result_face_look 위에 바로 겹쳐서 출력.
  // 먼저 outcome을 보여준 뒤 look을 제거하므로 bg_result가 중간에 노출되지 않는다.
  setTimeout(()=>{
    outcomeFace.style.display = '';
    outcomeFace.classList.add('show');

    requestAnimationFrame(()=>{
      lookFace.classList.remove('show');
      lookFace.style.display = 'none';
    });
  }, 2100);

  // 결과 얼굴이 나온 뒤 결과 텍스트 출력.
  setTimeout(()=>{
    if(overallSuccess){
      sfx.complete();
      badge.textContent = t('result.success.badge');
      badge.classList.add('success');

      // 성공 시 speech.1~3 중 하나를 랜덤으로 선택한다.
      const successSpeechKey = `result.success.speech.${1 + Math.floor(Math.random() * 3)}`;

      speech.innerHTML =
        `<div class="result-speech-main">${stringToHtml(t(successSpeechKey))}</div>` +
        `<div class="result-closing result-closing-success">${stringToHtml(t('result.closing.success'))}</div>`;
    }else{
      sfx.fail();
      badge.textContent = t('result.fail.badge');
      badge.classList.add('fail');

      let speechText = '';
      let descriptionText = '';

      if(!state.doughOK && !state.toppingOK){
        speechText = t('result.fail.doughAndTopping.speech');
        descriptionText = t('result.fail.doughAndTopping.description');
      }else if(!state.doughOK){
        const bad = state.doughFailInfo.includedBad.map(i=>t(i.nameKey));
        const missing = state.doughFailInfo.missingMust.map(i=>t(i.nameKey));
        let detail = '';
        if(bad.length) detail += `어딘가 ${bad.join(', ')} 맛이 나는 것 같아... `;
        if(missing.length) detail += `그리고 ${missing.join(', ')}이(가) 빠져서 그런지 맛의 균형이 안 맞아.`;
        speechText = `${t('result.fail.dough.speech')} ${detail}`;
        descriptionText = t('result.fail.dough.description');
      }else{
        speechText = t('result.fail.topping.speech');
        descriptionText = t('result.fail.topping.description');
      }

      speech.innerHTML =
        `<div class="result-speech-main">${stringToHtml(speechText)}</div>` +
        `<div class="result-description">${stringToHtml(descriptionText)}</div>` +
        `<div class="result-closing">${stringToHtml(t('result.closing.fail'))}</div>`;
    }

    badge.classList.remove('hidden');
    speech.classList.remove('hidden');

    // 6 → 결과 텍스트가 나온 뒤 2초 후 다시 만들기 버튼 출력.
    setTimeout(()=>{
      retryBtn.classList.add('show');

      // 다시 만들기 버튼이 나온 뒤 7초 이상 지나면
      // 먼저 result_face_look을 제거하고, 다음 프레임에 success/fail 얼굴도 제거한다.
      setTimeout(()=>{
        // 먼저 look 얼굴을 1초 동안 부드럽게 Fade Out.
        lookFace.classList.add('face-removing');

        setTimeout(()=>{
          lookFace.classList.remove('show', 'face-removing');
          lookFace.style.display = 'none';

          // look이 완전히 사라진 뒤 success/fail도 1초 동안 Fade Out.
          outcomeFace.classList.add('face-removing');

          setTimeout(()=>{
            outcomeFace.classList.remove('show', 'face-removing');
            outcomeFace.style.display = 'none';
          }, 1000);
        }, 1000);
      }, 4000);
    }, 2000);
  }, 2450);
}

/* ---------- 즉시 게임오버 ---------- */
function gameOver(reason){
  setMainBGMVolume(0.45);
  if(ovenAnim) cancelAnimationFrame(ovenAnim);
  if(ovenTickInterval){ clearInterval(ovenTickInterval); ovenTickInterval = null; }
  if(meringueInterval) clearInterval(meringueInterval);
  sfx.stirStop();
  sfx.fail();
  showScreen('gameover');
  const cookingArea = document.getElementById('shared-cooking-area');
  if(cookingArea) cookingArea.style.display = 'none';
  const stirZone = document.getElementById('stir-zone');
  if(stirZone) stirZone.style.display = 'none';
  const cakeLayer = document.getElementById('shared-cake-layer');
  if(cakeLayer) cakeLayer.style.display = 'none';
  const speech = document.getElementById('gameover-speech');
  const keyByReason = {
    meringue: 'gameover.meringue',
    oven_temp: 'gameover.ovenTemperature',
    oven_timing: 'gameover.ovenTiming'
  };
  const descByReason = {
    oven_temp: 'gameover.ovenTemperature.description',
    oven_timing: 'gameover.ovenTiming.description'
  };
  const key = keyByReason[reason];
  let html = key ? stringToHtml(t(key)) : '';
  if(descByReason[reason]) html += `<br>${stringToHtml(t(descByReason[reason]))}`;
  speech.innerHTML = html || stringToHtml(t('gameover.fail'));
}
/* ---------- 재시작 ---------- */
function retryFromResult(){
  sfx.click();
  stopResultBGM();
  restoreMainBGMVolume();
  resetState();
  goTo('home');

  // Result → Home: 새 게임이므로 main BGM을 처음부터 다시 시작한다.
  if(bgmEnabled){
    startMainBGM(true, true);
  }
  const cookingArea = document.getElementById('shared-cooking-area');
  if(cookingArea) cookingArea.style.display = 'none';
  const stirZone = document.getElementById('stir-zone');
  if(stirZone) stirZone.style.display = 'none';
  const meringueOverlay = document.getElementById('meringue-bowl-overlay');
  if(meringueOverlay) meringueOverlay.classList.remove('show');
  const cakeLayer = document.getElementById('shared-cake-layer');
  if(cakeLayer) cakeLayer.style.display = 'none';
  const noteWrap = document.getElementById('shared-cake-note-wrap');
  if(noteWrap) noteWrap.classList.remove('show');
}

function retryFromGameOver(){
  sfx.click();
  // bgm_main은 Game Over 동안에도 계속 재생 중이므로 처음부터 재시작하지 않는다.
  restoreMainBGMVolume();
  resetState();
  goTo('home');
  const cookingArea = document.getElementById('shared-cooking-area');
  if(cookingArea) cookingArea.style.display = 'none';
  const stirZone = document.getElementById('stir-zone');
  if(stirZone) stirZone.style.display = 'none';
  const meringueOverlay = document.getElementById('meringue-bowl-overlay');
  if(meringueOverlay) meringueOverlay.classList.remove('show');
  const cakeLayer = document.getElementById('shared-cake-layer');
  if(cakeLayer) cakeLayer.style.display = 'none';
  const noteWrap = document.getElementById('shared-cake-note-wrap');
  if(noteWrap) noteWrap.classList.remove('show');
}

function restartGame(){
  retryFromResult();
}
</script>
